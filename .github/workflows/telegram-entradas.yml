name: Telegram → entradas

on:
  schedule:
    # A cada 15 min (*/5 gerava fila longa e cancels em outage de runners)
    - cron: "*/15 * * * *"
  # Manual: Actions → Telegram → entradas → Run workflow (must be {} not null)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-entradas
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import photos from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          chmod +x scripts/telegram-import.sh
          scripts/telegram-import.sh

      - name: Commit new entradas
        run: |
          git config user.name "receitas-bot"
          git config user.email "receitas-bot@users.noreply.github.com"
          git add entradas .github/telegram-offset
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add recipe photos from Telegram"
          git push
